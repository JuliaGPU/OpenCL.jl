name: Test

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ matrix.memory_backend }} - ${{ matrix.driver }} - ${{ matrix.llvm_to_spirv_backend }}
    runs-on: ${{ matrix.os }}
    # the macOS runners take about twice as long as the others
    timeout-minutes: ${{ startsWith(matrix.os, 'macos') && 150 || 100 }}
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      # Hand-picked configurations instead of a full cross-product: the memory backend
      # is a host-side, load-time preference that's essentially orthogonal to OS, arch,
      # Julia version and PoCL build, so we cover all backends on the primary platform
      # (Linux x64) and rotate them across the other platforms. The `driver` axis selects
      # the OpenCL CPU driver: the released PoCL JLL (`pocl`), the upcoming release
      # (`pocl_next`, via pocl_next_jll, run on every platform), or Intel's CPU runtime
      # (`intel_cpu`, via intel_opencl_rt_jll, on the x64 platforms it supports).
      matrix:
        include:
          # full memory-backend coverage on the primary platform
          - { os: ubuntu-24.04, arch: x64, version: '1.13', driver: pocl, memory_backend: usm, llvm_to_spirv_backend: llvm }
          - { os: ubuntu-24.04, arch: x64, version: '1.13', driver: pocl, memory_backend: svm, llvm_to_spirv_backend: llvm }
          - { os: ubuntu-24.04, arch: x64, version: '1.13', driver: pocl, memory_backend: buffer, llvm_to_spirv_backend: llvm }
          # oldest supported Julia
          - { os: ubuntu-24.04, arch: x64, version: '1.10', driver: pocl, memory_backend: usm, llvm_to_spirv_backend: llvm }
          # other platforms, one job each (backends rotated for extra cross-coverage)
          - { os: ubuntu-24.04-arm, arch: arm64, version: '1.13', driver: pocl, memory_backend: svm, llvm_to_spirv_backend: llvm }
          - { os: windows-2022, arch: x64, version: '1.13', driver: pocl, memory_backend: usm, llvm_to_spirv_backend: llvm }  # requires 1.13.1 (JuliaLang/julia#63123)
          - { os: macos-26, arch: arm64, version: '1.13', driver: pocl, memory_backend: buffer, llvm_to_spirv_backend: llvm }
          # upcoming PoCL release (pocl_next_jll) on every platform
          - { os: ubuntu-24.04, arch: x64, version: '1.13', driver: pocl_next, memory_backend: usm, llvm_to_spirv_backend: llvm }
          - { os: ubuntu-24.04-arm, arch: arm64, version: '1.13', driver: pocl_next, memory_backend: svm, llvm_to_spirv_backend: llvm }
          - { os: windows-2022, arch: x64, version: '1.13', driver: pocl_next, memory_backend: buffer, llvm_to_spirv_backend: llvm }  # requires 1.13.1 (JuliaLang/julia#63123)
          - { os: macos-26, arch: arm64, version: '1.13', driver: pocl_next, memory_backend: usm, llvm_to_spirv_backend: llvm }
          # Intel's CPU runtime, only available for x64 Linux and Windows
          - { os: ubuntu-24.04, arch: x64, version: '1.13', driver: intel_cpu, memory_backend: usm, llvm_to_spirv_backend: llvm }
          - { os: windows-2022, arch: x64, version: '1.13', driver: intel_cpu, memory_backend: usm, llvm_to_spirv_backend: llvm }  # requires 1.13.1 (JuliaLang/julia#63123)
          # khronos backend for LLVM -> SPIRV translation
          - { os: ubuntu-24.04, arch: x64, version: '1.13', driver: pocl, memory_backend: usm, llvm_to_spirv_backend: khronos }
    steps: &steps
      - name: Checkout OpenCL.jl
        uses: actions/checkout@v7

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      # On the SVE-capable ARM runners (Neoverse-N2), loop vectorization can extract a
      # pointer from a scalable vector at a dynamic lane, which late GC lowering in Julia
      # 1.13 and earlier reads as a constant, crashing OpenCL's precompilation. Target a
      # CPU without SVE until the fix (JuliaLang/julia#62933) is backported.
      - name: Avoid SVE code generation
        if: runner.arch == 'ARM64' && matrix.version != 'nightly'
        run: echo "JULIA_CPU_TARGET=neoverse-n1" >> "$GITHUB_ENV"

      - name: Setup Julia cache
        uses: julia-actions/cache@v3

      - name: Setup OpenCL.jl
        run: |
          echo '[OpenCL]' >> test/LocalPreferences.toml
          echo 'default_memory_backend="${{ matrix.memory_backend }}"' >> test/LocalPreferences.toml
          echo 'llvm_to_spirv_backend="${{ matrix.llvm_to_spirv_backend }}"' >> test/LocalPreferences.toml
          julia --project -e '
            using Pkg
            # Julia 1.10 does not support [sources], so dev the in-tree
            # SPIRVIntrinsics; Pkg.test then carries it into the test sandbox.
            Pkg.develop(path="lib/intrinsics")'

      - name: Test OpenCL.jl
        uses: julia-actions/julia-runtest@v1
        with:
          test_args: "--quickfail --verbose --platform=${{ matrix.driver }}"

      - name: Upload compilation dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compilation-dumps-${{ matrix.version }}-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.memory_backend }}-${{ matrix.driver }}-${{ matrix.llvm_to_spirv_backend }}
          path: ${{ runner.temp }}/opencl-compilation-dumps/
          if-no-files-found: ignore

      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info

  # Configurations that rarely fail on their own on pull requests: intermediate and
  # upcoming Julia releases. They are tested on pushes to main instead.
  test-branch:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ matrix.memory_backend }} - ${{ matrix.driver }} - ${{ matrix.llvm_to_spirv_backend }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x64, version: '1.11', driver: pocl, memory_backend: usm, llvm_to_spirv_backend: llvm }
          - { os: ubuntu-24.04, arch: x64, version: '1.12', driver: pocl, memory_backend: usm, llvm_to_spirv_backend: llvm }
          - { os: ubuntu-24.04, arch: x64, version: 'nightly', driver: pocl, memory_backend: usm, llvm_to_spirv_backend: llvm }
    steps: *steps
