# Tests on hardware that GitHub Actions doesn't provide. Draft pull requests skip them, unless
# selected by name in the last commit message: `[only cuda]`, `[only macos]`, or `[only tests]`
# for both. `[skip macos]` or `[skip tests]` does the opposite (as in GPUCompiler.jl's CI).
steps:
  - label: "CUDA"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.13"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    commands: |
      julia --project .buildkite/sparse-v13-stack.jl --platform=cuda
    agents:
      queue: "cuda"
    if: |
      build.message !~ /\[skip [^\]]*(tests|cuda)/ &&
      (build.message =~ /\[only [^\]]*(tests|cuda)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    env:
      OCL_ICD_FILENAMES: "libnvidia-opencl.so.1"
    timeout_in_minutes: 60

  - group: "macos"
    key: "julia"
    steps:
      - label: "{{matrix.julia}} macos - {{matrix.pocl}}"
        plugins:
          - JuliaCI/julia#v1:
              version: "{{matrix.julia}}"
          - JuliaCI/julia-coverage#v1:
              codecov: true
        commands: |
          julia --project .buildkite/sparse-v13-stack.jl --platform={{matrix.pocl}} --verbose
        agents:
          queue: "metal"
        if: |
          build.message !~ /\[skip [^\]]*(tests|macos)/ &&
          (build.message =~ /\[only [^\]]*(tests|macos)/ ||
           build.message !~ /\[only / && !build.pull_request.draft)
        timeout_in_minutes: 90
        matrix:
          setup:
            julia:
              - "1.10"
              - "1.13"
            pocl:
              - "pocl"
              - "pocl_next"
          adjustments:
            # the upcoming PoCL release is only smoke-tested on current Julia
            - with:
                julia: "1.10"
                pocl: "pocl_next"
              skip: true
