# Tests on hardware that GitHub Actions doesn't provide. Draft pull requests skip them, unless
# selected by name in the last commit message: `[only cuda]`, `[only macos]`, or `[only tests]`
# for both. `[skip macos]` or `[skip tests]` does the opposite (as in GPUCompiler.jl's CI).
steps:
  - label: "CUDA"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.13"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    commands: |
      julia --project -e '
        using Pkg

        println("--- :julia: Instantiating project")
        # Julia 1.10 does not support [sources], so dev the in-tree
        # SPIRVIntrinsics; Pkg.test then carries it into the test sandbox.
        Pkg.develop(path="lib/intrinsics")

        println("+++ :julia: Running tests")
        Pkg.test(; coverage=true, test_args=`--platform=cuda`)'
    agents:
      queue: "cuda"
    if: |
      build.message !~ /\[skip [^\]]*(tests|cuda)/ &&
      (build.message =~ /\[only [^\]]*(tests|cuda)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    env:
      OCL_ICD_FILENAMES: "libnvidia-opencl.so.1"
    timeout_in_minutes: 60

  - group: "macos"
    key: "julia"
    steps:
      # Other macOS configurations run on GitHub Actions. Julia 1.10 hangs there, because its
      # libuv can miss the exit of a child process on macOS (JuliaLang/libuv#50).
      - label: "1.10 macos - pocl"
        plugins:
          - JuliaCI/julia#v1:
              version: "1.10"
          - JuliaCI/julia-coverage#v1:
              codecov: true
        commands: |
          julia --project -e '
            using Pkg

            println("--- :julia: Instantiating project")
            # Julia 1.10 does not support [sources], so dev the in-tree
            # SPIRVIntrinsics first; otherwise the Pkg.add below resolves
            # against the registry, which has no SPIRVIntrinsics 1. Pkg.test
            # then carries the in-tree copy into the test sandbox.
            Pkg.develop(path="lib/intrinsics")
            Pkg.add("pocl_jll")
            Pkg.add("InteractiveUtils")

            println("+++ :julia: Running tests")
            using InteractiveUtils
            InteractiveUtils.versioninfo()
            Pkg.test(; coverage=true, test_args=`--platform=pocl --verbose`)'
        agents:
          queue: "metal"
        if: |
          build.message !~ /\[skip [^\]]*(tests|macos)/ &&
          (build.message =~ /\[only [^\]]*(tests|macos)/ ||
           build.message !~ /\[only / && !build.pull_request.draft)
        timeout_in_minutes: 90
