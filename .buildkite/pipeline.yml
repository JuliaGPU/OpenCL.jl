# Tests on hardware that GitHub Actions doesn't provide. Draft pull requests skip them, unless
# selected by name in the last commit message: `[only cuda]`, `[only macos]`, or `[only tests]`
# for both. `[skip macos]` or `[skip tests]` does the opposite (as in GPUCompiler.jl's CI).
steps:
  - label: "CUDA"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.13"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    commands: |
      julia --project -e '
        using Pkg

        println("--- :julia: Instantiating project")
        # Julia 1.10 does not support [sources], so dev the in-tree
        # SPIRVIntrinsics; Pkg.test then carries it into the test sandbox.
        Pkg.develop(path="lib/intrinsics")

        println("+++ :julia: Running tests")
        Pkg.test(; coverage=true, test_args=`--platform=cuda`)'
    agents:
      queue: "cuda"
    if: |
      build.message !~ /\[skip [^\]]*(tests|cuda)/ &&
      (build.message =~ /\[only [^\]]*(tests|cuda)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    env:
      OCL_ICD_FILENAMES: "libnvidia-opencl.so.1"
    timeout_in_minutes: 60

  # Debug PR: run the full test suite as the macOS CI does, which is where KernelAbstractions'
  # `groupreduce` test fails now and then, with test/kernelabstractions.jl checking the same
  # launches with diagnostics (.buildkite/debug/groupreduce_check.jl).
  - group: "macos"
    key: "julia"
    steps:
      - label: "1.13 macos - pocl_next - full suite, check before: {{matrix.before}} #{{matrix.rep}}"
        plugins:
          - JuliaCI/julia#v1:
              version: "1.13"
        commands: |
          set -u -o pipefail
          OUT="$$PWD/debug-out"
          mkdir -p "$$OUT"
          # a fresh PoCL kernel cache, kept for the artifacts
          export POCL_CACHE_DIR="$$OUT/kcache"
          export GROUPREDUCE_DEBUG_DIR="$$OUT/groupreduce"
          export GROUPREDUCE_CHECK_BEFORE="{{matrix.before}}"
          status=0

          echo "--- :julia: Instantiating project"
          julia --project -e '
            using Pkg
            Pkg.develop(path="lib/intrinsics")
            Pkg.add("pocl_next_jll")
            Pkg.add("InteractiveUtils")
            using InteractiveUtils
            InteractiveUtils.versioninfo()'
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize || true
          uptime

          # the first run starts from an empty PoCL kernel cache, the second reuses it
          for i in 1 2; do
            echo "+++ :julia: Running tests, run $$i"
            julia --project -e 'using Pkg; Pkg.test(; coverage=true, test_args=`--platform=pocl_next --verbose`)' 2>&1 |
              tee "$$OUT/test$$i.log" || status=1
          done

          echo "--- :buildkite: Uploading results"
          touch "$$GROUPREDUCE_DEBUG_DIR/failures.log"
          cp "$$GROUPREDUCE_DEBUG_DIR/failures.log" failures.log
          buildkite-agent artifact upload failures.log
          if [ $$status -ne 0 ] || grep -q FAILURE failures.log; then
            # the generated code of the checks, and PoCL's binaries of all groupreduce kernels
            grep -rl groupreduce "$$POCL_CACHE_DIR" | xargs -n1 dirname | sort -u > kcache-dirs.txt || true
            tar czf debug-out.tar.gz "$$GROUPREDUCE_DEBUG_DIR" "$$OUT"/test*.log $$(cat kcache-dirs.txt)
            buildkite-agent artifact upload debug-out.tar.gz
            { echo "**check before: {{matrix.before}} #{{matrix.rep}}**"; echo '```';
              grep -h -A1 -E "Error in testset|Test Failed|Evaluated" "$$OUT"/test*.log | cut -c1-300 | head -30;
              grep -A3 FAILURE failures.log | head -40; echo '```'; } |
              buildkite-agent annotate --style error --context "debug-{{matrix.before}}-{{matrix.rep}}"
          fi
          exit $$status
        agents:
          queue: "metal"
        if: |
          build.message !~ /\[skip [^\]]*(tests|macos)/ &&
          (build.message =~ /\[only [^\]]*(tests|macos)/ ||
           build.message !~ /\[only / && !build.pull_request.draft)
        timeout_in_minutes: 150
        matrix:
          setup:
            before:
              - "true"
              - "false"
            rep:
              - "1"
              - "2"
              - "3"
