name = "SPIRVIntrinsics"
uuid = "71d1d633-e7e8-4a92-83a1-de8814b09ba8"
authors = ["Tim Besard <tim.besard@gmail.com>"]
version = "1.4.0"

[deps]
ExprTools = "e2ba6199-217a-4e67-a87a-7c52f15ade04"
GPUToolbox = "096a3bc2-3ced-46d0-87f4-dd12716f4bfc"
LLVM = "929cbde3-209d-540e-8aea-75f648917ca0"
SpecialFunctions = "276daf66-3868-5448-9aa4-cd146d93841b"
UnsafeAtomics = "013be700-e6cd-48c3-b4a1-df204f14c38f"

[weakdeps]
# Not used by any extension: the atomics need a GPUCompiler that legalizes LLVM atomics for
# SPIR-V, and the compat bound keeps the resolver from combining them with an older one.
GPUCompiler = "61eb1bfa-7361-4325-ad38-22787b887f55"
SIMD = "fdea26ae-647d-5447-a871-4b548cad5224"

[extensions]
SPIRVIntrinsicsSIMDExt = "SIMD"

[compat]
ExprTools = "0.1"
GPUCompiler = "2.13"
GPUToolbox = "0.2, 0.3, 1, 2, 3"
LLVM = "10"
SIMD = "3.6"
SpecialFunctions = "1.3, 2"
UnsafeAtomics = "0.4"
julia = "1.10"
